<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Intelligence Engine</title>
<style>
:root{
  --bg:#020610;--bg2:#040a14;--card:#07111d;--card2:#091525;--line:#1d2b3e;
  --text:#f8fbff;--muted:#8f9bae;--muted2:#647188;--purple:#9a63ff;--green:#28ef62;
  --red:#ff4e5f;--blue:#12b8ff;--orange:#ff9b08;--cyan:#51e7ff;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 70% -10%,rgba(38,62,120,.18),transparent 32%),
 linear-gradient(180deg,#01050d 0%,#040915 55%,#020610 100%);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(84px + var(--safe-b));overflow-x:hidden}
button{font:inherit;color:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:80;background:rgba(2,6,16,.94);backdrop-filter:blur(20px);
 border-bottom:1px solid rgba(39,56,82,.75);padding:calc(11px + var(--safe-t)) 12px 9px}
.header-row{max-width:1180px;margin:auto;display:grid;grid-template-columns:34px 1fr auto 30px;align-items:center;gap:9px}
.hamb,.bell{width:30px;height:30px;border:0;background:none;padding:0;font-size:22px;display:grid;place-items:center;color:#e7edf7}
.brandline{min-width:0;display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#f8fbff,#b5c0ff 54%,#8b55ff);
 display:grid;place-items:center;color:#060911;font-size:19px;font-weight:950;box-shadow:0 0 22px rgba(139,85,255,.26)}
.brand{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:9px;color:#9aa6b8;font-weight:500;margin-top:1px}
.health{display:flex;align-items:center;gap:6px;border:1px solid #2a394e;border-radius:999px;background:#07101c;padding:7px 9px;
 font-size:9.5px;color:#dce4f0;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#67758a}.dot.up{background:var(--green);box-shadow:0 0 9px var(--green)}
.dot.deg{background:#ffb020}.dot.down{background:var(--red)}

/* TOP TABS */
.market-tabs-wrap{position:sticky;top:64px;z-index:70;background:rgba(2,6,16,.96);backdrop-filter:blur(18px);
 border-bottom:1px solid #17253a;padding:5px 8px}
.market-tabs{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.22fr repeat(4,1fr);gap:3px;min-width:620px}
.market-tabs-scroll{overflow-x:auto;scrollbar-width:none}.market-tabs-scroll::-webkit-scrollbar{display:none}
.mtab{border:1px solid transparent;background:transparent;color:#d5dce7;border-radius:10px;padding:9px 8px;font-size:11px;font-weight:650;
 display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mtab .ico{font-size:16px}.mtab.active{border-color:#7443e0;color:#c49cff;background:linear-gradient(180deg,#2f1e632d,#1a123b27)}
.mtab.crypto .ico{color:#f7931a}.mtab.forex .ico{color:#44e36c}.mtab.metals .ico{color:#ffb30e}.mtab.indices .ico{color:#22baff}

/* COMMON */
main{max-width:1180px;margin:auto;padding:11px 10px 20px}
.view{display:none}.view.active{display:block;animation:fade .14s ease}@keyframes fade{from{opacity:.55}to{opacity:1}}
.card{background:linear-gradient(180deg,rgba(7,17,29,.98),rgba(4,11,20,.99));border:1px solid #203149;border-radius:14px;
 box-shadow:0 12px 34px rgba(0,0,0,.28);overflow:hidden}
.section{font-size:11px;color:#aeb8c8;text-transform:uppercase;letter-spacing:.72px;margin:3px 2px 8px}
.muted{color:var(--muted)}.sub{font-size:9.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;border:1px solid #42516a;border-radius:6px;padding:2px 5px;font-size:7.5px;font-weight:800;letter-spacing:.55px}
.b-live{color:#40ff75;border-color:#1b8c3e;background:#10391e7a}.b-stale{color:#ffc85c;border-color:#8a641e}.b-invalid,.b-desync{color:#ff7b86;border-color:#84343d}
.b-missing,.b-unknown{color:#c0cad8}.b-mapped,.b-notmapped{color:#5ce7ff;border-color:#2b7483}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #263750;border-top-color:#32cfff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.state{padding:22px;text-align:center;color:#8d9ab0;font-size:11px}.state strong{display:block;color:white;font-size:13px;margin-bottom:4px}

/* DASHBOARD KPI row — four across, like reference */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px}
.kpi{min-height:116px;padding:11px 10px;position:relative}
.klabel{font-size:8px;letter-spacing:.35px;color:#d2d8e3;text-transform:uppercase;white-space:nowrap}
.kvalue{font-size:18px;font-weight:800;margin-top:8px}.kvalue.green{color:var(--green)}
.kfooter{position:absolute;left:10px;right:10px;bottom:9px;color:#9aa6b8;font-size:8px;line-height:1.35}
.sparkline{position:absolute;left:9px;right:9px;bottom:22px;height:26px;opacity:.9}
.sparkline svg{width:100%;height:100%}
.info{width:17px;height:17px;border:1px solid #59677c;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#a9b5c6}

/* MARKET HOURS */
.hours{margin-bottom:10px;padding:12px}
.hours-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:10px}
.hours-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:12px;align-items:stretch}
.market-open{font-size:17px;font-weight:800;color:var(--green);display:flex;gap:6px;align-items:center}.market-open .orb{width:16px;height:16px;border-radius:50%;background:linear-gradient(#48ff7b,#159f3f);box-shadow:0 0 13px #21dc5940}
.market-status{font-size:10px;color:#d4dbe7;margin-top:7px}.indic{font-size:7px;background:#302353;color:#c5a2ff;border-radius:4px;padding:2px 4px;margin-left:4px}
.closebox{border:1px solid #21334c;border-radius:10px;background:#030a14;margin-top:10px;padding:8px 9px}.closebox .t1{font-size:9px;color:#d2d9e5}.closebox .t2{font-size:16px;font-weight:800;margin-top:3px}.closebox .t2 .green{color:var(--green)}
.localtime{margin-top:11px;display:flex;gap:7px;align-items:flex-start;color:#a5b0c1;font-size:8.5px}.localtime b{display:block;color:#dce3ef;font-size:9.5px;margin-top:1px}

/* World map approximation with CSS dots — decorative only */
.mapbox{position:relative;min-height:166px;border-left:1px solid #1e3047;padding-left:9px;overflow:hidden}
.world{position:absolute;inset:4px 3px 22px 12px;opacity:.55}
.world svg{width:100%;height:100%}
.scard{position:absolute;border:1px solid #7444e0;background:#07101de8;border-radius:8px;padding:6px 8px;text-align:center;font-size:8px;min-width:78px}
.scard b{display:block;font-size:9px;margin-bottom:2px}.scard.sydney{left:7%;top:58%}.scard.london{left:44%;top:13%;border-color:#22d95b}.scard.ny{right:3%;top:57%;border-color:#168eea}
.scard.london span{color:#41f278}.timeline{position:absolute;left:12px;right:4px;bottom:4px;border-top:1px solid #24354d;display:flex;justify-content:space-between;padding-top:4px;font-size:7px;color:#8c98aa}

/* Favorites table */
.fav{margin-bottom:10px}.favhead{display:flex;align-items:center;justify-content:space-between;padding:10px 11px 7px}.favhead b{font-size:13px}.favhead span{font-size:9px;color:#b78cff}
.favcols{display:grid;grid-template-columns:1.55fr .85fr .85fr .65fr .82fr 12px;gap:5px;padding:0 11px 6px;color:#9ba6b7;font-size:7.5px}
.frow{display:grid;grid-template-columns:1.55fr .85fr .85fr .65fr .82fr 12px;gap:5px;align-items:center;padding:8px 11px;border-top:1px solid #1d2a3f;min-height:54px}
.asset{display:flex;align-items:center;gap:7px;min-width:0}.star{color:#ffad0a;font-size:13px}.coin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
.coin.btc{background:#f7931a}.coin.eth{background:#5c68f1}.coin.sol{background:#0c1520;color:#5ef3d6;border:1px solid #1c2b40}.coin.gold{background:#d79b00}.coin.idx{background:#17395f}
.sym{font-size:10.5px;font-weight:800;white-space:nowrap}.aname{font-size:7.5px;color:#9ba6b8;margin-top:2px;white-space:nowrap}
.fprice{font-size:9.5px;font-weight:750;text-align:right}.fsmall{font-size:7px;color:#8e9aae;margin-top:1px;text-align:right}
.change{font-size:9.5px;text-align:right;color:#8190a6}.quality{text-align:center}.mini{height:25px}.mini svg{width:100%;height:100%}.chev{font-size:17px;color:#eef3fb;text-align:right}

/* Action cards */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action{min-height:103px;padding:11px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.action .aico{font-size:26px;margin-bottom:6px}.action b{font-size:10.5px}.action span{font-size:8px;margin-top:3px}.blue{color:var(--blue)}.purple{color:#d56cff}.green{color:var(--green)}.orange{color:var(--orange)}

/* Other market views */
.listcard{margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-bottom:1px solid #1d2a3f;min-height:60px}.row:last-child{border:0}.row.tap{cursor:pointer}
.price{font-size:12px;font-weight:750;text-align:right}.na{color:#7c899d}.right{display:flex;align-items:center;gap:7px}.back{border:1px solid #253750;background:#081321;color:#b7c2d4;border-radius:9px;padding:7px 9px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #1d2a3f}.kv .k{color:#8d9ab0}.tbl-wrap{overflow:auto}.tbl{width:100%;min-width:440px;border-collapse:collapse;white-space:nowrap}.tbl th,.tbl td{padding:9px;text-align:right;border-bottom:1px solid #1d2a3f;font-size:10px}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{font-size:8px;color:#8290a5}

/* BOTTOM NAV */
.nav{position:fixed;left:5px;right:5px;bottom:5px;z-index:90;display:flex;background:rgba(6,14,27,.97);backdrop-filter:blur(18px);border:1px solid #203149;border-radius:22px;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 16px 48px #0009}
.nav button{flex:1;border:0;background:none;color:#7c899e;min-height:51px;border-radius:13px;font-size:8px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav .ic{font-size:18px}.nav button[aria-current=page]{color:#bb8fff}.nav button[aria-current=page] .ic{filter:drop-shadow(0 0 5px #8755ff)}
.note{font-size:8px;color:#607086;text-align:center;margin:8px 0 2px}

/* Make reference-like proportions even on narrower phones */
@media(max-width:430px){
  .header-row{grid-template-columns:28px 1fr auto 26px;gap:6px}.hamb,.bell{font-size:18px}.logo{width:30px;height:30px}.brand{font-size:13px}.health{padding:6px 7px;font-size:8.5px}
  .market-tabs-wrap{top:59px}.market-tabs{min-width:560px}.mtab{font-size:10px;padding:8px 7px}
  main{padding:9px 7px 18px}.kpis{gap:4px}.kpi{padding:9px 6px;min-height:103px}.klabel{font-size:6.8px}.kvalue{font-size:15px}.kfooter{left:6px;right:6px;font-size:6.8px}
  .hours{padding:10px}.hours-grid{grid-template-columns:.9fr 1.1fr;gap:7px}.hours-title{font-size:11px}.market-open{font-size:14px}.mapbox{min-height:145px}.scard{min-width:63px;padding:5px 4px;font-size:6.7px}.scard b{font-size:8px}
  .favcols,.frow{grid-template-columns:1.58fr .85fr .72fr .58fr .7fr 10px;padding-left:8px;padding-right:8px;gap:3px}.coin{width:24px;height:24px}.sym{font-size:9px}.aname{font-size:6.5px}
  .fprice,.change{font-size:8px}.actions{gap:4px}.action{min-height:91px}.action .aico{font-size:22px}.action b{font-size:9px}.action span{font-size:7px}
}
@media(min-width:760px){body{padding-bottom:28px}.nav{position:sticky;max-width:760px;margin:14px auto 0}.brand{font-size:18px}.market-tabs-wrap{top:68px}}
</style>

function loadRealChart(){if(!detailCtx)return;chartState.status="LOADING";drawRealChart();api(chartPath(detailCtx.kind,detailCtx.canonical||detailCtx.symbol,chartState.tf)).then(function(r){if(!byId("real-chart"))return;if(!r.ok){chartState.candles=[];chartState.status=errorMessage(r);drawRealChart();return}var d=r.data||{},cs=validChartCandles(d.candles);chartState.candles=cs;chartState.offset=0;chartState.source=d.source||"backend";chartState.quality=d.latest_quality||(cs.length?cs[cs.length-1].quality:"MISSING");chartState.status=cs.length?"OK":"EMPTY";var q=byId("chart-quality");if(q){clear(q);q.appendChild(qualityBadge(chartState.quality))}var n=byId("chart-count");if(n)n.textContent=String(cs.length)+" bougies";drawRealChart()})}

function chartPan(delta){var n=Math.min(chartState.visible,chartState.candles.length),maxOff=Math.max(0,chartState.candles.length-n);chartState.offset=Math.max(0,Math.min(maxOff,chartState.offset+delta));drawRealChart()}

  var controls=h("div",{class:"chart-controls"},[h("button",{onclick:function(){chartPan(12)},title:"Historique plus ancien"},["←"]),h("button",{onclick:function(){chartZoom(15)},title:"Dézoomer"},["−"]),h("button",{onclick:function(){chartZoom(-15)},title:"Zoomer"},["+"]),h("button",{onclick:function(){chartPan(-12)},title:"Historique plus récent"},["→"])]);
  var shell=h("div",{class:"section-stack",id:"future-chart-shell"},[
    modCard("Chart Engine · OHLC réel","REAL DATA",h("div",{class:"section-stack"},[h("div",{class:"chart-head"},[tfrow,controls]),h("div",{class:"chart-meta"},[h("span",{},["Source backend · aucune bougie synthétique"]),h("span",{id:"chart-count"},["0 bougie"]),h("span",{id:"chart-quality"},[qualityBadge("UNKNOWN")])]),h("div",{class:"real-chart",id:"real-chart"},[loading("Chargement des bougies réelles…")])])),
    modCard("Overlays Market Intelligence","NOT IMPLEMENTED",h("div",{class:"badge-row"},[h("span",{class:"badge-soft"},["BOS"]),h("span",{class:"badge-soft"},["CHoCH/MSS"]),h("span",{class:"badge-soft"},["Liquidity Sweep"]),h("span",{class:"badge-soft"},["Order Block"]),h("span",{class:"badge-soft"},["FVG"]),h("span",{class:"badge-soft"},["Supply/Demand"])]))
  ]);v.appendChild(shell);loadRealChart()

function applyOfficialAssetLogos(){
  document.querySelectorAll(".frow").forEach(row=>{
    const txt=(row.textContent||"").toUpperCase();
    let key=null;
    for(const k of ["BTC","ETH","SOL","XRP","LTC","ADA","XAU","US30"]){
      if(txt.includes(k)){key=k;break}
    }
    if(!key)return;
    const el=row.querySelector(".coin");
    if(el && ASSET_LOGOS[key]){el.innerHTML=ASSET_LOGOS[key];el.classList.add("official-logo")}
  });
}
