<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Crypto Intelligence Engine</title>
  <style>
    :root{
      --bg:#0e1116; --panel:#171b22; --panel2:#1e232c; --line:#2a303b;
      --text:#e8edf4; --muted:#98a2b3; --accent:#3b82f6;
      --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --grey:#6b7280; --blue:#38bdf8;
      --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      font-size:16px;line-height:1.4;overflow-x:hidden}
    body{max-width:100%;min-height:100vh;padding-bottom:calc(72px + var(--safe-b))}
    a{color:inherit}
    .header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#12161c,#0e1116);
      border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 16px 10px}
    .header__row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{font-weight:700;font-size:17px;letter-spacing:.2px}
    .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.3px}
    .hdot{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
      background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--grey);flex:0 0 auto}
    .dot.up{background:var(--green)} .dot.deg{background:var(--amber)}
    .dot.down{background:var(--red)} .dot.unk{background:var(--grey)}
    .refresh{margin-top:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .refresh .spark{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.5}
    main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
    .view{display:none} .view.active{display:block}
    h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
      margin:4px 2px 10px;font-weight:600}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      margin:0 0 12px;overflow:hidden}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 16px;border-bottom:1px solid var(--line);min-height:60px}
    .row:last-child{border-bottom:none}
    .row.tap{cursor:pointer;transition:background .12s} .row.tap:active{background:var(--panel2)}
    .row.disabled{opacity:.6}
    .sym{font-weight:600;font-size:16px} .sub{color:var(--muted);font-size:12px;margin-top:2px}
    .price{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:right}
    .price .na{color:var(--muted);font-weight:500}
    .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;
      padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
    .b-live{color:#052e12;background:var(--green)} .b-stale{color:#3a2600;background:var(--amber)}
    .b-invalid{color:#3a0a0a;background:var(--red)} .b-missing{color:var(--text);background:var(--panel2)}
    .b-unknown{color:var(--text);background:var(--panel2)} .b-notmapped{color:#04212b;background:var(--blue)}
    .b-desync{color:#3a0a0a;background:var(--red)}
    .chip{display:inline-flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
    .tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--panel);
      border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
    .tab[aria-current="page"]{color:var(--text);background:var(--panel2);border-color:var(--accent)}
    .tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    .tbl th,.tbl td{padding:9px 10px;text-align:right;font-size:13px;border-bottom:1px solid var(--line)}
    .tbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
    .tbl th:first-child,.tbl td:first-child{text-align:left}
    .muted{color:var(--muted)} .center{text-align:center}
    .state{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
    .state strong{display:block;color:var(--text);margin-bottom:4px;font-size:15px}
    .kv{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
    .kv:last-child{border-bottom:none} .kv .k{color:var(--muted)} .kv .v{font-weight:600}
    .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:none;
      font-size:14px;padding:6px 2px;margin-bottom:6px;cursor:pointer}
    .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;
      background:linear-gradient(0deg,#0c0f14,#12161c);border-top:1px solid var(--line);
      padding:8px 12px calc(8px + var(--safe-b))}
    .nav button{flex:1;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;
      padding:8px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;
      align-items:center;gap:4px;min-height:48px}
    .nav button[aria-current="page"]{color:var(--text);background:var(--panel2)}
    .nav .ic{font-size:18px;line-height:1}
    .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);
      border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
    @keyframes sp{to{transform:rotate(360deg)}}
    @media (min-width:760px){ body{padding-bottom:20px}
      .nav{position:sticky;bottom:auto;top:0;max-width:760px;margin:14px auto 0;border-radius:12px;
        border:1px solid var(--line)} }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__row">
      <div class="brand">Crypto Intelligence Engine<small>Markets · version de test</small></div>
      <div class="hdot"><span class="dot unk" id="health-dot"></span><span id="health-label">…</span></div>
    </div>
    <div class="refresh"><span class="spark"></span><span>Auto-refresh: 5s (polling, pas de streaming)</span></div>
  </header>

  <main>
    <section class="view active" id="view-markets" data-view="markets"></section>
    <section class="view" id="view-forex" data-view="forex"></section>
    <section class="view" id="view-system" data-view="system"></section>
    <section class="view" id="view-detail" data-view="detail"></section>
  </main>

  <nav class="nav" id="nav"></nav>

  <script>
  "use strict";
  // ---- Views registry (ids used by static tests) --------------------------
  var VIEWS = [
    { id:"markets", label:"Crypto", icon:"₿" },
    { id:"forex",   label:"Forex",  icon:"$" },
    { id:"system",  label:"Système", icon:"◔" }
    // id:"detail" is an internal view (asset detail), not a bottom tab
  ];
  var DETAIL_VIEW = { id:"detail" };

  // ---- Config (NO backend URL hardcoded: same-origin relative calls) ------
  var CRYPTO_SYMBOLS = ["BTC-USD","ETH-USD","SOL-USD","XRP-USD","LTC-USD","ADA-USD"];
  var POLL_MS = 5000;

  // ---- Tiny DOM helpers ---------------------------------------------------
  function h(tag, attrs, kids){
    var e = document.createElement(tag); attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids||[]).forEach(function(c){
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function byId(id){ return document.getElementById(id); }

  // ---- API client: relative, same-origin, timeout + honest error mapping --
  function api(path){
    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 8000);
    return fetch(path, { headers:{ "Accept":"application/json" }, signal: ctrl.signal })
      .then(function(res){
        clearTimeout(to);
        return res.text().then(function(txt){
          var data = null; try { data = txt ? JSON.parse(txt) : null; } catch(e){ data = null; }
          return { ok: res.ok, status: res.status, data: data };
        });
      })
      .catch(function(err){
        clearTimeout(to);
        var net = (err && err.name === "AbortError") ? "timeout" : "network";
        return { ok:false, status:0, data:null, netError: net };
      });
  }
  // Map a non-ok response to a human message from the REAL backend reason.
  function errorMessage(r){
    if (r.netError === "timeout") return "Délai dépassé — réseau lent ou backend indisponible.";
    if (r.netError === "network") return "Réseau indisponible — impossible de joindre le backend.";
    var reason = (r.data && (r.data.reason || (r.data.detail && r.data.detail.reason))) || null;
    switch (r.status){
      case 400: return reason || "Requête invalide.";
      case 401:
      case 403: return "Accès refusé au provider.";
      case 409: return reason || "Symbole non mappé.";
      case 429: return "Trop de requêtes — réessayez dans un instant.";
      case 503: return reason || "Provider temporairement indisponible.";
    }
    if (r.status >= 500) return "Erreur serveur.";
    return reason || ("Erreur (" + r.status + ").");
  }

  // ---- Formatting (never NaN / undefined) ---------------------------------
  function fmtNum(v){
    if (v === null || v === undefined || v === "" || isNaN(Number(v))) return null;
    var n = Number(v);
    var abs = Math.abs(n);
    var d = abs >= 1000 ? 2 : abs >= 1 ? 4 : 6;
    return n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:d });
  }
  function priceCell(v){
    var s = fmtNum(v);
    return s === null ? h("span",{class:"na"},["—"]) : document.createTextNode(s);
  }
  // Quality (backend) -> display badge. Only real backend states are used.
  function qualityBadge(q){
    var map = {
      VALID:["LIVE","b-live"], STALE:["STALE","b-stale"], INVALID:["INVALID","b-invalid"],
      MISSING:["NO DATA","b-missing"], UNKNOWN:["UNKNOWN","b-unknown"],
      NOT_MAPPED:["NOT MAPPED","b-notmapped"], DESYNC:["DESYNC","b-desync"]
    };
    var m = map[q] || ["UNKNOWN","b-unknown"];
    return h("span",{class:"badge "+m[1]},[m[0]]);
  }
  function tsAgo(iso){
    if (!iso) return "";
    var t = Date.parse(iso); if (isNaN(t)) return "";
    var s = Math.max(0, Math.round((Date.now()-t)/1000));
    return s < 90 ? (s+"s") : (Math.round(s/60)+"min");
  }
  function loading(txt){ return h("div",{class:"state"},[h("span",{class:"spin"}),"  "+(txt||"Chargement…")]); }
  function emptyState(title, sub){ return h("div",{class:"state"},[h("strong",{},[title]), sub||""]); }

  // ---- State --------------------------------------------------------------
  var current = "markets";
  var detailCtx = null;   // { kind:"crypto"|"forex", symbol, canonical }

  // ---- Health (header dot) ------------------------------------------------
  function refreshHealth(){
    return api("/health").then(function(r){
      var dot = byId("health-dot"), lab = byId("health-label");
      dot.className = "dot unk"; lab.textContent = "inconnu";
      if (!r.ok || !r.data){ lab.textContent = "backend indisponible"; dot.className="dot down"; return; }
      var overall = r.data.overall || "UNKNOWN";
      var cls = overall==="UP"?"up":overall==="DEGRADED"?"deg":overall==="DOWN"?"down":"unk";
      dot.className = "dot "+cls; lab.textContent = "backend " + overall.toLowerCase();
    });
  }

  // ---- Markets (Crypto Coinbase) -----------------------------------------
  function renderMarkets(){
    var v = byId("view-markets"); clear(v);
    v.appendChild(h("h2",{class:"section"},["Crypto · Coinbase (réel)"]));
    var card = h("div",{class:"card"},[]);
    CRYPTO_SYMBOLS.forEach(function(sym){
      card.appendChild(h("div",{class:"row tap","data-sym":sym, onclick:function(){ openDetail("crypto",sym); }},[
        h("div",{},[ h("div",{class:"sym"},[sym]), h("div",{class:"sub"},["Coinbase"]) ]),
        h("div",{style:"display:flex;align-items:center;gap:10px"},[
          h("span",{class:"price","data-price":sym},[h("span",{class:"na"},["…"])]),
          h("span",{"data-badge":sym},[])
        ])
      ]));
    });
    v.appendChild(card);
    v.appendChild(h("div",{class:"muted",style:"font-size:12px;padding:2px 4px"},
      ["Prix et qualité fournis par le backend. Aucune valeur estimée côté interface."]));
    refreshMarkets();
  }
  function refreshMarkets(){
    CRYPTO_SYMBOLS.forEach(function(sym){
      api("/api/v1/market/ticker/"+encodeURIComponent(sym)).then(function(r){
        var pc = document.querySelector('[data-price="'+sym+'"]');
        var bc = document.querySelector('[data-badge="'+sym+'"]');
        if (!pc || !bc) return;
        clear(pc); clear(bc);
        if (!r.ok || !r.data){ pc.appendChild(h("span",{class:"na"},["indispo"]));
          bc.appendChild(qualityBadge("UNKNOWN")); return; }
        pc.appendChild(priceCell(r.data.value));
        bc.appendChild(qualityBadge(r.data.quality));
      });
    });
  }

  // ---- Forex (Massive) ----------------------------------------------------
  function renderForex(){
    var v = byId("view-forex"); clear(v);
    v.appendChild(h("h2",{class:"section"},["Forex · Massive (réel)"]));
    v.appendChild(loading("Lecture des mappings…"));
    api("/api/v1/market/forex/mappings").then(function(r){
      clear(v); v.appendChild(h("h2",{class:"section"},["Forex · Massive (réel)"]));
      if (!r.ok || !r.data){ v.appendChild(emptyState("Forex indisponible", errorMessage(r))); return; }
      var act = r.data.activation || {};
      var note = act.activated
        ? (act.confirmed_count + " paire(s) mappée(s) officiellement")
        : "Mappings non activés (clé provider absente côté serveur) — symboles NOT_MAPPED.";
      v.appendChild(h("div",{class:"muted",style:"font-size:12px;padding:0 4px 10px"},[note]));
      var card = h("div",{class:"card"},[]);
      (r.data.mappings||[]).forEach(function(m){
        var mapped = m.status === "MAPPED";
        card.appendChild(h("div",{class:"row "+(mapped?"tap":"disabled"),
          onclick: mapped ? function(){ openDetail("forex", m.canonical); } : null },[
          h("div",{},[ h("div",{class:"sym"},[m.canonical]),
            h("div",{class:"sub"},[ mapped ? ("Massive · "+(m.provider_symbol||"")) : "Non disponible" ]) ]),
          qualityBadge(mapped ? "VALID" : "NOT_MAPPED")
        ]));
      });
      v.appendChild(card);
      if (act.xau && act.xau.ticker){
        v.appendChild(h("div",{class:"muted",style:"font-size:12px;padding:2px 4px"},
          ["XAU détecté par le provider ("+act.xau.ticker+") — non intégré dans cette version."]));
      }
    });
  }

  // ---- Detail (price + recent candles) ------------------------------------
  function alignHour(sec){ return Math.floor(sec/3600)*3600; }
  function openDetail(kind, symbol){
    detailCtx = { kind:kind, symbol:symbol, canonical:symbol };
    setView("detail");
  }
  function renderDetail(){
    var v = byId("view-detail"); clear(v);
    if (!detailCtx){ v.appendChild(emptyState("Aucun actif sélectionné","")); return; }
    v.appendChild(h("button",{class:"back", onclick:function(){ setView(detailCtx.kind==="forex"?"forex":"markets"); }},["← Retour"]));
    v.appendChild(h("h2",{class:"section"},[detailCtx.symbol + " · " + (detailCtx.kind==="forex"?"Forex Massive":"Crypto Coinbase")]));

    if (detailCtx.kind === "crypto"){
      var quote = h("div",{class:"card"},[ h("div",{class:"kv"},[
        h("span",{class:"k"},["Prix"]), h("span",{class:"v","id":"d-price"},[h("span",{class:"spin"})]) ]) ]);
      v.appendChild(quote);
    }
    var histWrap = h("div",{class:"card","id":"d-hist"},[ loading("Historique réel…") ]);
    v.appendChild(histWrap);
    refreshDetail();
  }
  function refreshDetail(){
    if (!detailCtx) return;
    if (detailCtx.kind === "crypto"){
      api("/api/v1/market/ticker/"+encodeURIComponent(detailCtx.symbol)).then(function(r){
        var pe = byId("d-price"); if (!pe) return; clear(pe);
        if (!r.ok || !r.data){ pe.appendChild(h("span",{class:"na"},["—"])); return; }
        pe.appendChild(priceCell(r.data.value));
        pe.appendChild(document.createTextNode("  "));
        pe.appendChild(qualityBadge(r.data.quality));
        if (r.data.timestamp){ pe.appendChild(h("span",{class:"sub",style:"margin-left:8px"},
          ["il y a "+tsAgo(r.data.timestamp)])); }
      });
      loadCandles("/api/v1/market/candles/"+encodeURIComponent(detailCtx.symbol)+"?granularity=1h");
    } else {
      var end = alignHour(Math.floor(Date.now()/1000));
      var start = end - 12*3600;
      loadCandles("/api/v1/market/forex/"+encodeURIComponent(detailCtx.canonical)+
        "/history?granularity=1h&start="+start+"&end="+end);
    }
  }
  function loadCandles(path){
    api(path).then(function(r){
      var w = byId("d-hist"); if (!w) return; clear(w);
      if (!r.ok){ w.appendChild(emptyState("Historique indisponible", errorMessage(r))); return; }
      var d = r.data || {};
      var candles = d.candles || [];
      var header = h("div",{class:"kv"},[ h("span",{class:"k"},["Dernières bougies (1h)"]),
        h("span",{class:"v"},[ qualityBadge(d.quality || (candles.length?"VALID":"MISSING")) ]) ]);
      w.appendChild(header);
      if (!candles.length){ w.appendChild(emptyState("Pas de données",
        d.status==="EMPTY"?"Aucune bougie sur la période.":"")); return; }
      var rows = candles.slice(-10).reverse().map(function(c){
        return h("tr",{},[
          h("td",{},[ (c.start||"").replace("T"," ").slice(0,16) ]),
          h("td",{},[ priceCell(c.open) ]), h("td",{},[ priceCell(c.high) ]),
          h("td",{},[ priceCell(c.low) ]), h("td",{},[ priceCell(c.close) ])
        ]);
      });
      w.appendChild(h("table",{class:"tbl"},[
        h("thead",{},[ h("tr",{},[ h("th",{},["Heure (UTC)"]), h("th",{},["O"]),
          h("th",{},["H"]), h("th",{},["L"]), h("th",{},["C"]) ]) ]),
        h("tbody",{}, rows)
      ]));
      if (d.gaps_status === "UNKNOWN"){
        w.appendChild(h("div",{class:"muted",style:"font-size:11px;padding:8px 12px"},
          ["Détection de trous: UNKNOWN (calendrier Forex non configuré — une barre absente n'est pas un trou)."]));
      }
    });
  }

  // ---- System (health) ----------------------------------------------------
  function renderSystem(){
    var v = byId("view-system"); clear(v);
    v.appendChild(h("h2",{class:"section"},["Santé backend & données"]));
    v.appendChild(loading("Lecture de /health…"));
    api("/health").then(function(r){
      clear(v); v.appendChild(h("h2",{class:"section"},["Santé backend & données"]));
      if (!r.ok || !r.data){ v.appendChild(emptyState("Backend indisponible", errorMessage(r))); return; }
      var d = r.data;
      var card = h("div",{class:"card"},[]);
      card.appendChild(h("div",{class:"kv"},[h("span",{class:"k"},["État global"]),
        h("span",{class:"v"},[ d.overall || "UNKNOWN" ])]));
      (d.components||[]).forEach(function(c){
        card.appendChild(h("div",{class:"kv"},[h("span",{class:"k"},[c.name]),
          h("span",{class:"v"},[ c.state || "?" ])]));
      });
      if (d.persistence){
        card.appendChild(h("div",{class:"kv"},[h("span",{class:"k"},["Persistance"]),
          h("span",{class:"v"},[ d.persistence.persistence_status || "?" ])]));
      }
      v.appendChild(card);
    });
  }

  // ---- Router / nav -------------------------------------------------------
  function setView(id){
    current = id;
    var views = document.querySelectorAll(".view");
    for (var i=0;i<views.length;i++){
      views[i].classList.toggle("active", views[i].getAttribute("data-view")===id);
    }
    var btns = document.querySelectorAll("#nav button");
    for (var j=0;j<btns.length;j++){
      var on = btns[j].getAttribute("data-view")===id;
      if (on) btns[j].setAttribute("aria-current","page"); else btns[j].removeAttribute("aria-current");
    }
    if (id==="markets") renderMarkets();
    else if (id==="forex") renderForex();
    else if (id==="system") renderSystem();
    else if (id==="detail") renderDetail();
  }
  function buildNav(){
    var nav = byId("nav"); clear(nav);
    VIEWS.forEach(function(v){
      nav.appendChild(h("button",{"data-view":v.id, onclick:function(){ setView(v.id); }},[
        h("span",{class:"ic"},[v.icon]), v.label
      ]));
    });
  }

  // ---- Polling (provisional, every 5s; NOT websocket/streaming) -----------
  function poll(){
    refreshHealth();
    if (current==="markets") refreshMarkets();
    else if (current==="detail") refreshDetail();
    else if (current==="system") renderSystem();
  }

  // ---- Boot ---------------------------------------------------------------
  buildNav();
  refreshHealth();
  setView("markets");
  setInterval(poll, POLL_MS);
  </script>
</body>
</html>
