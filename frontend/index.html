<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crypto Intelligence Engine</title>
<style>
:root{
  --bg:#020610;--bg2:#040a14;--card:#07111d;--card2:#091525;--line:#1d2b3e;
  --text:#f8fbff;--muted:#8f9bae;--muted2:#647188;--purple:#9a63ff;--green:#28ef62;
  --red:#ff4e5f;--blue:#12b8ff;--orange:#ff9b08;--cyan:#51e7ff;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 70% -10%,rgba(38,62,120,.18),transparent 32%),
 linear-gradient(180deg,#01050d 0%,#040915 55%,#020610 100%);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(84px + var(--safe-b));overflow-x:hidden}
button{font:inherit;color:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:80;background:rgba(2,6,16,.94);backdrop-filter:blur(20px);
 border-bottom:1px solid rgba(39,56,82,.75);padding:calc(11px + var(--safe-t)) 12px 9px}
.header-row{max-width:1180px;margin:auto;display:grid;grid-template-columns:34px 1fr auto 30px;align-items:center;gap:9px}
.hamb,.bell{width:30px;height:30px;border:0;background:none;padding:0;font-size:22px;display:grid;place-items:center;color:#e7edf7}
.brandline{min-width:0;display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#f8fbff,#b5c0ff 54%,#8b55ff);
 display:grid;place-items:center;color:#060911;font-size:19px;font-weight:950;box-shadow:0 0 22px rgba(139,85,255,.26)}
.brand{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:9px;color:#9aa6b8;font-weight:500;margin-top:1px}
.health{display:flex;align-items:center;gap:6px;border:1px solid #2a394e;border-radius:999px;background:#07101c;padding:7px 9px;
 font-size:9.5px;color:#dce4f0;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#67758a}.dot.up{background:var(--green);box-shadow:0 0 9px var(--green)}
.dot.deg{background:#ffb020}.dot.down{background:var(--red)}

/* TOP TABS */
.market-tabs-wrap{position:sticky;top:64px;z-index:70;background:rgba(2,6,16,.96);backdrop-filter:blur(18px);
 border-bottom:1px solid #17253a;padding:5px 8px}
.market-tabs{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.22fr repeat(5,1fr);gap:3px;min-width:720px}
.market-tabs-scroll{overflow-x:auto;scrollbar-width:none}.market-tabs-scroll::-webkit-scrollbar{display:none}
.mtab{border:1px solid transparent;background:transparent;color:#d5dce7;border-radius:10px;padding:9px 8px;font-size:11px;font-weight:650;
 display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mtab .ico{font-size:16px}.mtab.active{border-color:#7443e0;color:#c49cff;background:linear-gradient(180deg,#2f1e632d,#1a123b27)}
.mtab.crypto .ico{color:#f7931a}.mtab.forex .ico{color:#44e36c}.mtab.metals .ico{color:#ffb30e}.mtab.indices .ico{color:#22baff}

/* COMMON */
main{max-width:1180px;margin:auto;padding:11px 10px 20px}
.view{display:none}.view.active{display:block;animation:fade .14s ease}@keyframes fade{from{opacity:.55}to{opacity:1}}

body.workspace-mode .market-tabs-wrap{display:none}
body.workspace-mode main{padding-top:14px}
.paper-shell{min-height:320px}
.paper-render-error{padding:18px;border:1px solid #743944;border-radius:14px;
 background:#251017;color:#ffb4bd;font-size:11px;line-height:1.5}
.card{background:linear-gradient(180deg,rgba(7,17,29,.98),rgba(4,11,20,.99));border:1px solid #203149;border-radius:14px;
 box-shadow:0 12px 34px rgba(0,0,0,.28);overflow:hidden}
.section{font-size:11px;color:#aeb8c8;text-transform:uppercase;letter-spacing:.72px;margin:3px 2px 8px}
.muted{color:var(--muted)}.sub{font-size:9.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;border:1px solid #42516a;border-radius:6px;padding:2px 5px;font-size:7.5px;font-weight:800;letter-spacing:.55px}
.b-live{color:#40ff75;border-color:#1b8c3e;background:#10391e7a}.b-stale{color:#ffc85c;border-color:#8a641e}.b-invalid,.b-desync{color:#ff7b86;border-color:#84343d}
.b-missing,.b-unknown{color:#c0cad8}.b-mapped,.b-notmapped{color:#5ce7ff;border-color:#2b7483}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #263750;border-top-color:#32cfff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.state{padding:22px;text-align:center;color:#8d9ab0;font-size:11px}.state strong{display:block;color:white;font-size:13px;margin-bottom:4px}

/* DASHBOARD KPI row — four across, like reference */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px}
.kpi{min-height:116px;padding:11px 10px;position:relative}
.klabel{font-size:8px;letter-spacing:.35px;color:#d2d8e3;text-transform:uppercase;white-space:nowrap}
.kvalue{font-size:18px;font-weight:800;margin-top:8px}.kvalue.green{color:var(--green)}
.kfooter{position:absolute;left:10px;right:10px;bottom:9px;color:#9aa6b8;font-size:8px;line-height:1.35}
.sparkline{position:absolute;left:9px;right:9px;bottom:22px;height:26px;opacity:.9}
.sparkline svg{width:100%;height:100%}
.info{width:17px;height:17px;border:1px solid #59677c;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#a9b5c6}

/* MARKET HOURS */
.hours{margin-bottom:10px;padding:12px}
.hours-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:10px}
.hours-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:12px;align-items:stretch}
.market-open{font-size:17px;font-weight:800;color:var(--green);display:flex;gap:6px;align-items:center}.market-open .orb{width:16px;height:16px;border-radius:50%;background:linear-gradient(#48ff7b,#159f3f);box-shadow:0 0 13px #21dc5940}
.market-status{font-size:10px;color:#d4dbe7;margin-top:7px}.indic{font-size:7px;background:#302353;color:#c5a2ff;border-radius:4px;padding:2px 4px;margin-left:4px}
.closebox{border:1px solid #21334c;border-radius:10px;background:#030a14;margin-top:10px;padding:8px 9px}.closebox .t1{font-size:9px;color:#d2d9e5}.closebox .t2{font-size:16px;font-weight:800;margin-top:3px}.closebox .t2 .green{color:var(--green)}
.localtime{margin-top:11px;display:flex;gap:7px;align-items:flex-start;color:#a5b0c1;font-size:8.5px}.localtime b{display:block;color:#dce3ef;font-size:9.5px;margin-top:1px}

/* World map approximation with CSS dots — decorative only */
.mapbox{position:relative;min-height:166px;border-left:1px solid #1e3047;padding-left:9px;overflow:hidden}
.world{position:absolute;inset:4px 3px 22px 12px;opacity:.55}
.world svg{width:100%;height:100%}
.scard{position:absolute;border:1px solid #7444e0;background:#07101de8;border-radius:8px;padding:6px 8px;text-align:center;font-size:8px;min-width:78px}
.scard b{display:block;font-size:9px;margin-bottom:2px}.scard.sydney{left:7%;top:58%}.scard.london{left:44%;top:13%;border-color:#22d95b}.scard.ny{right:3%;top:57%;border-color:#168eea}
.scard.london span{color:#41f278}.timeline{position:absolute;left:12px;right:4px;bottom:4px;border-top:1px solid #24354d;display:flex;justify-content:space-between;padding-top:4px;font-size:7px;color:#8c98aa}

/* Favorites table */
.fav{margin-bottom:10px}.favhead{display:flex;align-items:center;justify-content:space-between;padding:10px 11px 7px}.favhead b{font-size:13px}.favhead span{font-size:9px;color:#b78cff}
.favcols{display:grid;grid-template-columns:1.55fr .85fr .85fr .65fr .82fr 12px;gap:5px;padding:0 11px 6px;color:#9ba6b7;font-size:7.5px}
.frow{display:grid;grid-template-columns:1.55fr .85fr .85fr .65fr .82fr 12px;gap:5px;align-items:center;padding:8px 11px;border-top:1px solid #1d2a3f;min-height:54px}
.asset{display:flex;align-items:center;gap:7px;min-width:0}.star{color:#ffad0a;font-size:13px}.coin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;flex:0 0 auto}
.coin.btc{background:#f7931a}.coin.eth{background:#5c68f1}.coin.sol{background:#0c1520;color:#5ef3d6;border:1px solid #1c2b40}.coin.gold{background:#d79b00}.coin.idx{background:#17395f}
.sym{font-size:10.5px;font-weight:800;white-space:nowrap}.aname{font-size:7.5px;color:#9ba6b8;margin-top:2px;white-space:nowrap}
.fprice{font-size:9.5px;font-weight:750;text-align:right}.fsmall{font-size:7px;color:#8e9aae;margin-top:1px;text-align:right}
.change{font-size:9.5px;text-align:right;color:#8190a6}.quality{text-align:center}.mini{height:25px}.mini svg{width:100%;height:100%}.chev{font-size:17px;color:#eef3fb;text-align:right}

/* Action cards */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action{min-height:103px;padding:11px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.action .aico{font-size:26px;margin-bottom:6px}.action b{font-size:10.5px}.action span{font-size:8px;margin-top:3px}.blue{color:var(--blue)}.purple{color:#d56cff}.green{color:var(--green)}.orange{color:var(--orange)}

/* Other market views */
.listcard{margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-bottom:1px solid #1d2a3f;min-height:60px}.row:last-child{border:0}.row.tap{cursor:pointer}
.price{font-size:12px;font-weight:750;text-align:right}.na{color:#7c899d}.right{display:flex;align-items:center;gap:7px}.back{border:1px solid #253750;background:#081321;color:#b7c2d4;border-radius:9px;padding:7px 9px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #1d2a3f}.kv .k{color:#8d9ab0}.tbl-wrap{overflow:auto}.tbl{width:100%;min-width:440px;border-collapse:collapse;white-space:nowrap}.tbl th,.tbl td{padding:9px;text-align:right;border-bottom:1px solid #1d2a3f;font-size:10px}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{font-size:8px;color:#8290a5}

/* BOTTOM NAV */
.nav{position:fixed;left:5px;right:5px;bottom:5px;z-index:90;display:flex;background:rgba(6,14,27,.97);backdrop-filter:blur(18px);border:1px solid #203149;border-radius:22px;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 16px 48px #0009}
.nav button{flex:1;border:0;background:none;color:#7c899e;min-height:51px;border-radius:13px;font-size:8px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav .ic{font-size:18px}.nav button[aria-current=page]{color:#bb8fff}.nav button[aria-current=page] .ic{filter:drop-shadow(0 0 5px #8755ff)}
.note{font-size:8px;color:#607086;text-align:center;margin:8px 0 2px}

/* Make reference-like proportions even on narrower phones */
@media(max-width:430px){
  .header-row{grid-template-columns:28px 1fr auto 26px;gap:6px}.hamb,.bell{font-size:18px}.logo{width:30px;height:30px}.brand{font-size:13px}.health{padding:6px 7px;font-size:8.5px}
  .market-tabs-wrap{top:59px}.market-tabs{min-width:560px}.mtab{font-size:10px;padding:8px 7px}
  main{padding:9px 7px 18px}.kpis{gap:4px}.kpi{padding:9px 6px;min-height:103px}.klabel{font-size:6.8px}.kvalue{font-size:15px}.kfooter{left:6px;right:6px;font-size:6.8px}
  .hours{padding:10px}.hours-grid{grid-template-columns:.9fr 1.1fr;gap:7px}.hours-title{font-size:11px}.market-open{font-size:14px}.mapbox{min-height:145px}.scard{min-width:63px;padding:5px 4px;font-size:6.7px}.scard b{font-size:8px}
  .favcols,.frow{grid-template-columns:1.58fr .85fr .72fr .58fr .7fr 10px;padding-left:8px;padding-right:8px;gap:3px}.coin{width:24px;height:24px}.sym{font-size:9px}.aname{font-size:6.5px}
  .fprice,.change{font-size:8px}.actions{gap:4px}.action{min-height:91px}.action .aico{font-size:22px}.action b{font-size:9px}.action span{font-size:7px}
}
@media(min-width:760px){body{padding-bottom:28px}.nav{position:sticky;max-width:760px;margin:14px auto 0}.brand{font-size:18px}.market-tabs-wrap{top:68px}}
/* V16-M5B28B4 · PAPER RESULT + STRATEGY CHART OVERLAY */
.paper-result-win{color:var(--green);font-weight:800}.paper-result-loss{color:var(--red);font-weight:800}.paper-result-flat{color:var(--orange);font-weight:800}
.trade-chart-btn{width:100%;margin-top:8px;min-height:44px;border:1px solid rgba(81,231,255,.35);border-radius:12px;background:rgba(81,231,255,.08);color:var(--cyan);font-weight:800;cursor:pointer}
.trade-overlay-entry{stroke:#51e7ff;stroke-width:2.2;stroke-dasharray:7 5}.trade-overlay-sl{stroke:#ff4e5f;stroke-width:2.2;stroke-dasharray:6 4}.trade-overlay-tp{stroke:#28ef62;stroke-width:2.2;stroke-dasharray:6 4}.trade-overlay-breakout{stroke:#ff9b08;stroke-width:3;stroke-dasharray:10 5}.trade-overlay-time{stroke:#9a63ff;stroke-width:1.5;stroke-dasharray:4 5;opacity:.85}.trade-overlay-close{stroke:#f8fbff;stroke-width:1.5;stroke-dasharray:3 4;opacity:.75}
.trade-overlay-label{font-size:11px;font-weight:800;paint-order:stroke;stroke:#020610;stroke-width:3px;stroke-linejoin:round}.trade-overlay-entry-label{fill:#51e7ff}.trade-overlay-sl-label{fill:#ff4e5f}.trade-overlay-tp-label{fill:#28ef62}.trade-overlay-strategy-label{fill:#ff9b08}.trade-overlay-time-label{fill:#c7a9ff}
.trade-overlay-banner{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 0}.trade-overlay-banner .status-pill{max-width:100%;overflow-wrap:anywhere}


/* V16-M5B28B5 · MOBILE COMPACT PAPER HISTORY */
.paper-history-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.paper-history-kpi{padding:10px;border:1px solid #203149;border-radius:12px;background:#06101b;min-width:0}.paper-history-kpi span{display:block;color:#8997aa;font-size:8px}.paper-history-kpi b{display:block;margin-top:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-history-filters{display:flex;gap:7px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}.paper-history-filter{min-height:38px;padding:0 14px;border:1px solid #203149;border-radius:999px;background:#06101b;color:#9aa8ba;font-weight:800}.paper-history-filter.active{border-color:rgba(81,231,255,.55);color:var(--cyan);background:rgba(81,231,255,.08)}
.paper-history-list{display:grid;gap:9px}.paper-trade-compact{border:1px solid #203149;border-radius:13px;background:#06101b;overflow:hidden}.paper-trade-compact>summary{list-style:none;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}.paper-trade-compact>summary::-webkit-details-marker{display:none}.paper-trade-top{display:flex;align-items:flex-start;gap:7px;min-width:0}.paper-trade-symbol{font-size:14px;font-weight:900;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.paper-trade-result{margin-left:auto;text-align:right;white-space:nowrap}.paper-trade-result b{display:block;font-size:13px}.paper-trade-result span{display:block;font-size:8px;margin-top:2px}.paper-trade-meta{margin-top:6px;color:#8997aa;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.paper-trade-levels{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:9px}.paper-trade-level{display:flex;justify-content:space-between;gap:8px;font-size:8px}.paper-trade-level span{color:#8997aa}.paper-trade-level b{font-size:9px}.paper-trade-outcome{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid #18283c;font-size:8px}.paper-trade-more{color:var(--cyan);font-weight:800}.paper-trade-details{padding:0 12px 12px;border-top:1px solid #18283c}.paper-trade-details .section-stack{padding-top:8px}.paper-trade-compact[open] .paper-trade-more:after{content:" · ouvert"}
.paper-history-detail-card{padding-top:10px}.paper-history-detail-hero{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.paper-history-detail-hero b{font-size:14px}.paper-history-detail-strategy{margin-top:7px}.paper-history-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.paper-history-detail-cell{padding:9px 10px;border:1px solid #1c2d42;border-radius:10px;background:#07111d;min-width:0}.paper-history-detail-cell span{display:block;color:#7f8da1;font-size:7px}.paper-history-detail-cell b{display:block;margin-top:3px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.paper-history-detail-result{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding:9px 10px;border:1px solid #1c2d42;border-radius:10px;background:#07111d}.paper-history-detail-result strong{font-size:13px}.paper-history-detail-result span{font-size:8px;color:#8b99ad;text-align:right}.paper-history-detail-time{margin-top:8px;color:#8391a5;font-size:8px;text-align:center}.paper-history-detail-card .trade-chart-btn{margin-top:10px}
@media(min-width:760px){.paper-history-summary{grid-template-columns:repeat(4,minmax(0,1fr))}.paper-history-list{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* V17-ENERGY-UI3 — instrument/index marks, same-origin/no external assets */
.coin.energy-mark,.coin.index-mark{display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-weight:900;letter-spacing:-.04em}
.coin.energy-mark svg{width:100%;height:100%;display:block}
.coin.index-mark{font-size:11px;border:1px solid rgba(255,255,255,.16);background:#0e1a2a;color:#f5f7fb}
.coin.spx-mark{font-size:9px}
.coin.ndx-mark{font-size:17px}
.coin.dow-mark{font-size:10px}

/* V17-ENERGY-UI4 — Forex pair flags (no external assets) */
.fx-pair-icon{position:relative;display:inline-flex;width:54px;height:38px;flex:0 0 54px;align-items:center}
.fx-flag{position:absolute;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;background:#0d1726;border:2px solid #1d3148;box-shadow:0 4px 12px rgba(0,0,0,.28);overflow:hidden}
.fx-flag-a{left:0;z-index:2}
.fx-flag-b{left:20px;z-index:1}

/* V17-UI5 — Strategy/Adaptive Edge mobile polish; real backend data only */
#view-strategies .module-title.matrix-title{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0;
}
#view-strategies .module-title.matrix-title>div{min-width:0;flex:1 1 auto}
#view-strategies .module-title.matrix-title h3{margin:0 0 4px;font-size:22px;line-height:1.08}
#view-strategies .module-title.matrix-title p{margin:0;max-width:100%;overflow-wrap:anywhere}
#view-strategies .matrix-validation{
  flex:0 1 auto;max-width:42%;white-space:normal;text-align:right;
  overflow-wrap:anywhere;word-break:break-word;font-size:10px;line-height:1.2;
}
#view-strategies .subtabs{
  overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;padding-bottom:2px;
}
#view-strategies .subtabs::-webkit-scrollbar{display:none}
#view-strategies .subtabs .subtab{flex:0 0 auto;min-width:138px;max-width:190px}
#view-strategies .matrix-cell-card{min-width:0}
#view-strategies .matrix-context{white-space:normal;overflow-wrap:anywhere}
#view-strategies .matrix-cell-card .metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
#view-strategies .matrix-cell-card .metric-mini{min-width:0}
#view-strategies .matrix-cell-card .metric-mini b{overflow-wrap:anywhere}

.edge-replay-card-v2{padding:16px!important}
.edge-replay-head-v2{display:flex!important;align-items:flex-start!important;justify-content:space-between;gap:10px;min-width:0}
.edge-replay-identity{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.edge-replay-identity .coin{flex:0 0 auto}
.edge-replay-identity>div{min-width:0}
.edge-replay-head-v2 .edge-replay-symbol{font-size:18px;line-height:1.1}
.edge-replay-head-v2 .edge-replay-context{margin-top:4px;font-size:12px}
.edge-replay-badges{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:54%}
.edge-replay-badges .strategy-badge,.edge-replay-badges .status-pill{max-width:100%;white-space:normal;text-align:center}
.edge-replay-proof-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 0}

/*
 * V17-UI21 FAST START
 * Load only the data required to make the account and OPEN positions useful.
 * Heavy history/performance/Adaptive Edge sections continue in refreshPaperTrading().
 */
function refreshPaperFastStart(){
  if(paperFastStartBusy)return Promise.resolve();
  paperFastStartBusy=true;
  return Promise.all([
    api("/api/v1/paper/account/live"),
    api("/api/v1/paper/positions?status_filter=OPEN"),
    api("/api/v1/paper/positions/live")
  ]).then(function(results){
    var accountResult=results[0],openResult=results[1],liveResult=results[2];
    if(accountResult&&accountResult.ok&&accountResult.data){
      paperUiState.account=accountResult.data;
    }
    if(openResult&&openResult.ok&&openResult.data&&Array.isArray(openResult.data.positions)){
      var persistedOpen=openResult.data.positions;
      var liveRows=liveResult&&liveResult.ok&&liveResult.data&&Array.isArray(liveResult.data.positions)
        ?liveResult.data.positions:[];
      var liveById={};
      liveRows.forEach(function(row){
        if(row&&row.position_id)liveById[row.position_id]=row;
      });
      var mergedOpen=persistedOpen.map(function(row){
        var liveRow=liveById[row.position_id];
        return liveRow?Object.assign({},row,liveRow):row;
      });
      paperOpenAuthoritativeIds=paperOpenIdSet(persistedOpen);
      paperOpenAuthorityReady=true;
      var closed=(paperUiState.positions||[]).filter(function(row){
        return String(row&&row.status||"").toUpperCase()!=="OPEN";
      });
      paperUiState.positions=closed.concat(mergedOpen);
    }
    paperUiState.error=null;
    paperUiState.updatedAt=new Date().toISOString();
    paperRenderChangedViews();
  }).finally(function(){
    paperFastStartBusy=false;
  });
}

function refreshPaperOpenPositions(){
  if(current!=="trading"||paperOpenRefreshBusy)return Promise.resolve();
  paperOpenRefreshBusy=true;
  /*
   * UI21-LIVE: refresh persisted OPEN state and live mark/P&L together.
   * Previously /positions/live was fetched only when a NEW position appeared,
   * so an already-open card could wait for the slower 5s snapshot or a tab
   * change before its visible mark/P&L changed.
   */
  return Promise.all([
    api("/api/v1/paper/positions?status_filter=OPEN"),
    api("/api/v1/paper/positions/live")
  ]).then(function(results){
    var openResult=results[0],liveResult=results[1];
    if(!openResult||!openResult.ok||!openResult.data||
       !Array.isArray(openResult.data.positions))return;

    var incoming=openResult.data.positions;
    var liveRows=liveResult&&liveResult.ok&&liveResult.data&&
      Array.isArray(liveResult.data.positions)?liveResult.data.positions:[];
    var liveById={};
    liveRows.forEach(function(row){
      if(row&&row.position_id)liveById[row.position_id]=row;
    });

    var incomingIds=paperOpenIdSet(incoming);
    var known={};
    var previousOpen=[];
    (paperUiState.positions||[]).forEach(function(row){
      if(row&&row.position_id){
        known[row.position_id]=row;
        if(String(row.status||"").toUpperCase()==="OPEN")previousOpen.push(row);
      }
    });

    var changed=false;
    var removedPositionDetected=false;
    var mergedOpen=[];

    incoming.forEach(function(row){
      if(!row||!row.position_id)return;
      var previous=known[row.position_id];
      var liveRow=liveById[row.position_id];
      /*
       * Persisted metadata is the base; live data wins for current mark/P&L.
       * If live enrichment is temporarily unavailable, preserve the richer
       * previous row instead of flickering fields back to "—".
       */
      var merged=Object.assign({},row,previous||{},liveRow||{});
      mergedOpen.push(merged);
      if(!previous||
         stableUiFingerprint(previous)!==stableUiFingerprint(merged)){
        changed=true;
      }
    });

    previousOpen.forEach(function(row){
      if(row&&row.position_id&&!incomingIds[row.position_id]){
        changed=true;
        removedPositionDetected=true;
      }
    });

    paperOpenAuthoritativeIds=incomingIds;
    paperOpenAuthorityReady=true;

    if(changed){
      var closed=(paperUiState.positions||[]).filter(function(row){
        return String(row&&row.status||"").toUpperCase()!=="OPEN";
      });
      paperUiState.positions=closed.concat(mergedOpen);
      paperUiState.updatedAt=new Date().toISOString();
      paperRenderChangedViews();
    }

    if(removedPositionDetected)refreshPaperClosedHistory();
  }).finally(function(){
    paperOpenRefreshBusy=false;
  });
}

function refreshPaperTrading(){
  if(paperUiState.loading)return Promise.resolve();
  paperUiState.loading=true;
  var snapshotPath="/api/v1/paper/ui-snapshot",snapshotParams=[];
  if(paperUiState.decisionSymbol)snapshotParams.push("symbol="+encodeURIComponent(paperUiState.decisionSymbol));
  if(paperUiState.decisionState)snapshotParams.push("state="+encodeURIComponent(paperUiState.decisionState));
  if(snapshotParams.length)snapshotPath+="?"+snapshotParams.join("&");
  return Promise.all([api(snapshotPath),api("/api/v1/paper/multi-asset-monitoring"),api("/api/v1/paper/adaptive-edge/decision-replay?limit=50"),api("/api/v1/paper/adaptive-edge/impact-validation?period=ALL"),api("/api/v1/paper/adaptive-edge/policy-calibration?period=ALL"),api("/api/v1/paper/adaptive-edge/policy"),api("/api/v1/paper/adaptive-edge/policy-impact?period=ALL")]).then(function(results){
    var result=results[0],multi=result&&results[1];
    if(results[1]&&results[1].ok&&results[1].data)paperUiState.multiAsset=results[1].data;
    if(results[2]&&results[2].ok&&results[2].data){
      paperUiState.edgeReplay=Array.isArray(results[2].data.items)?results[2].data.items:[];
    }
    if(results[3]&&results[3].ok&&results[3].data){
      paperUiState.edgeImpact=results[3].data;
    }
    if(results[4]&&results[4].ok&&results[4].data){
      paperUiState.edgeCalibration=results[4].data;
    }
    if(results[5]&&results[5].ok&&results[5].data){
      paperUiState.edgePolicy=results[5].data;
    }
    if(results[6]&&results[6].ok&&results[6].data){
      paperUiState.edgePolicyImpact=results[6].data;
    }
    if(!result.ok||!result.data){paperUiState.error=errorMessage(result);return;}
    var snap=result.data,sections=snap.sections||{};
    paperUiState.serverSnapshotAt=snap.snapshot_at||null;
    paperUiState.sectionErrors={};
    Object.keys(sections).forEach(function(name){
      if(sections[name]&&sections[name].status!=="OK"){
        paperUiState.sectionErrors[name]=sections[name].reason||"UNAVAILABLE";
      }
    });
    var account=snapshotSection(snap,"account");
    var positions=snapshotSection(snap,"positions");
    var live=snapshotSection(snap,"live_positions");
    var performance=snapshotSection(snap,"performance");
    var decisions=snapshotSection(snap,"decision_history");
    var watchdog=snapshotSection(snap,"watchdog");
    var runtime=snapshotSection(snap,"runtime");
    if(account)paperUiState.account=account;
    if(performance)paperUiState.performance=performance;
    if(decisions)paperUiState.decisions=decisions.items||[];
    if(watchdog)paperUiState.watchdog=watchdog;
    if(runtime)paperUiState.runtime=runtime;
    if(positions){
      var persisted=positions.positions||[],liveRows=live&&live.positions||[],liveById={};
      liveRows.forEach(function(row){if(row&&row.position_id)liveById[row.position_id]=row});
      var snapshotById={};
      var mergedPersisted=persisted.map(function(row){
        if(row&&row.position_id)snapshotById[row.position_id]=row;
        return row.status==="OPEN"&&liveById[row.position_id]
          ?Object.assign({},row,liveById[row.position_id]):row;
      });

      /*
       * Snapshot requests are heavier and can finish after a newer 1s OPEN poll.
       * Never let an older snapshot erase a freshly discovered OPEN position.
       * A CLOSED row present in the snapshot still wins immediately.
       */
      if(paperOpenAuthorityReady){
        (paperUiState.positions||[]).forEach(function(row){
          if(!row||!row.position_id)return;
          if(String(row.status||"").toUpperCase()!=="OPEN")return;
          if(!paperOpenAuthoritativeIds[row.position_id])return;
          if(snapshotById[row.position_id])return;
          mergedPersisted.push(row);
        });
      }
      paperUiState.positions=mergedPersisted;
    }
    paperUiState.error=null;
    paperUiState.updatedAt=new Date().toISOString();
  }).finally(function(){
    paperUiState.loading=false;
    paperRenderChangedViews();
  });
}

function dashboardExposureSummary(){
  var open=(paperUiState.positions||[]).filter(function(p){return String(p.status||"").toUpperCase()==="OPEN"});
  var valid=open.filter(function(p){return p.mark_status==="VALID"&&p.unrealized_pnl!==null&&p.unrealized_pnl!==undefined&&Number.isFinite(Number(p.unrealized_pnl))});
  var pnl=valid.reduce(function(sum,p){return sum+Number(p.unrealized_pnl)},0);
  return {
    count:open.length,
    validCount:valid.length,
    pnl:valid.length?pnl:null,
    complete:open.length===valid.length
  };
}
